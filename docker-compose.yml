version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: honeypot_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-honeydb}
      POSTGRES_USER: ${POSTGRES_USER:-honeyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_volume_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeyuser} -d ${POSTGRES_DB:-honeydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published: only the analyzer service (on the internal
    # Docker network) needs to reach Postgres.

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: honeypot_traffic_analyzer
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-honeyuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-honeydb}
      - PORT=3000
    ports:
      - "3500:3000"  # Core Express Dashboard API (mapped to 3500 to avoid Grafana port 3000 conflict)
      - "2222:2222"  # SSH Decoy
      - "2323:2323"  # Telnet Decoy
      - "8085:8080"  # HTTP Admin Decoy (mapped to 8085 on host to avoid port 8080 conflict)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_volume_data:
